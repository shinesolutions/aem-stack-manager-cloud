---
name: Publish
'on':
  push:
    tags:
      - '*'
permissions:
  contents: read
  id-token: write
jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: cliffano/command-docker-action@v2.1.0
        with:
          command: make clean deps package
          image: shinesolutions/aem-platform-buildenv:6.3.0
          shell: bash
      - run: make publish
        env:
          GITHUB_TOKEN: ${{ secrets.SHINEOPENSOURCE_GITHUB_TOKEN }}
